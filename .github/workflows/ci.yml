name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-validation:
    name: Product site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:check
      - run: pnpm site:build

  source-validation:
    name: Source validation (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            architecture: x64
          - target: windows-x64
            os: windows-latest
            architecture: x64
          - target: macos-arm64
            os: macos-15
            architecture: arm64
          - target: macos-x64
            os: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          architecture: ${{ matrix.architecture }}
      - run: pnpm install --frozen-lockfile
      - run: node --version
      - run: pnpm validate

  release-linux-x64:
    name: Release artifacts (linux-x64)
    needs: source-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          architecture: x64
      - run: pnpm install --frozen-lockfile
      - name: Build and verify current-platform release artifacts
        run: pnpm release:verify
      - name: Record build provenance
        run: |
          {
            echo "## Linux x64 release build"
            echo '```text'
            cat release/crewlight-v0.5.0-linux-x64/BUILD-INFO.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: release/crewlight-v0.5.0-linux-x64.tar.gz
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: release/crewlight-v0.5.0-linux-x64.tar.gz.sha256
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: release/desktop-builder/Crewlight-0.5.0-x86_64.AppImage
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: release/desktop-builder/Crewlight-0.5.0-amd64.deb
          archive: false

  release-windows-x64:
    name: Release artifacts (windows-x64)
    needs: source-validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          architecture: x64
      - run: pnpm install --frozen-lockfile
      - name: Build and verify current-platform release artifacts
        run: pnpm release:verify
      - name: Record build provenance
        shell: pwsh
        run: |
          @(
            "## Windows x64 release build"
            '```text'
            (Get-Content release/crewlight-v0.5.0-windows-x64/BUILD-INFO.txt -Raw)
            '```'
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: release/crewlight-v0.5.0-windows-x64.zip
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: release/crewlight-v0.5.0-windows-x64.zip.sha256
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: release/crewlight-v0.5.0-windows-x64-desktop.zip
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: release/desktop-builder/crewlight-v0.5.0-windows-x64-installer.exe
          archive: false

  release-macos:
    name: Release artifacts (${{ matrix.target }})
    needs: source-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
            architecture: arm64
          - target: macos-x64
            os: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          architecture: ${{ matrix.architecture }}
      - run: pnpm install --frozen-lockfile
      - name: Build and verify current-platform release artifacts
        run: pnpm release:verify
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Record build provenance
        run: |
          {
            echo "## ${{ matrix.target }} release build"
            echo '```text'
            cat release/crewlight-v0.5.0-${{ matrix.target }}/BUILD-INFO.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: release/crewlight-v0.5.0-${{ matrix.target }}.tar.gz
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: release/crewlight-v0.5.0-${{ matrix.target }}.tar.gz.sha256
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: release/desktop-builder/Crewlight-0.5.0-${{ matrix.architecture }}.dmg
          archive: false
