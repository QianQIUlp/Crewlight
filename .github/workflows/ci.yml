name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-validation:
    name: Product site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:check
      - run: pnpm site:build

  source-validation:
    name: Source validation (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            architecture: x64
          - target: windows-x64
            os: windows-latest
            architecture: x64
          - target: macos-arm64
            os: macos-15
            architecture: arm64
          - target: macos-x64
            os: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
          architecture: ${{ matrix.architecture }}
      - run: pnpm install --frozen-lockfile
      - run: node --version
      - run: pnpm validate

  release-linux-x64:
    name: Release artifacts (linux-x64)
    needs: source-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
          architecture: x64
      - run: pnpm install --frozen-lockfile
      - id: version
        run: echo "value=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - run: pnpm release:node-runtime
      - name: Build and verify current-platform release artifacts
        run: pnpm release:verify
      - name: Record build provenance
        run: |
          {
            echo "## Linux x64 release build"
            echo '```text'
            cat release/crewlight-v${{ steps.version.outputs.value }}-linux-x64/BUILD-INFO.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: crewlight-v${{ steps.version.outputs.value }}-linux-x64
          if-no-files-found: error
          path: |
            release/crewlight-v${{ steps.version.outputs.value }}-linux-x64.tar.gz
            release/crewlight-v${{ steps.version.outputs.value }}-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: crewlight-v${{ steps.version.outputs.value }}-linux-x64-desktop
          if-no-files-found: error
          path: |
            release/desktop-builder/Crewlight-*.AppImage
            release/desktop-builder/Crewlight-*.AppImage.sha256
            release/desktop-builder/Crewlight-*.deb
            release/desktop-builder/Crewlight-*.deb.sha256

  release-windows-x64:
    name: Release artifacts (windows-x64)
    needs: source-validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
          architecture: x64
      - run: pnpm install --frozen-lockfile
      - id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - run: pnpm release:node-runtime
      - name: Build and verify current-platform release artifacts
        run: pnpm release:verify
      - name: Record build provenance
        shell: pwsh
        run: |
          @(
            "## Windows x64 release build"
            '```text'
            (Get-Content release/crewlight-v${{ steps.version.outputs.value }}-windows-x64/BUILD-INFO.txt -Raw)
            '```'
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: crewlight-v${{ steps.version.outputs.value }}-windows-x64
          if-no-files-found: error
          path: |
            release/crewlight-v${{ steps.version.outputs.value }}-windows-x64.zip
            release/crewlight-v${{ steps.version.outputs.value }}-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: crewlight-v${{ steps.version.outputs.value }}-windows-x64-desktop
          if-no-files-found: error
          path: |
            release/crewlight-v${{ steps.version.outputs.value }}-windows-x64-desktop.zip
            release/crewlight-v${{ steps.version.outputs.value }}-windows-x64-desktop.zip.sha256
            release/desktop-builder/crewlight-v${{ steps.version.outputs.value }}-windows-x64-installer.exe
            release/desktop-builder/crewlight-v${{ steps.version.outputs.value }}-windows-x64-installer.exe.sha256

  release-macos:
    name: Release artifacts (${{ matrix.target }})
    needs: source-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
            architecture: arm64
          - target: macos-x64
            os: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
          architecture: ${{ matrix.architecture }}
      - run: pnpm install --frozen-lockfile
      - id: version
        run: echo "value=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - run: pnpm release:node-runtime
      - name: Build and verify current-platform release artifacts
        run: pnpm release:verify
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Record build provenance
        run: |
          {
            echo "## ${{ matrix.target }} release build"
            echo '```text'
            cat release/crewlight-v${{ steps.version.outputs.value }}-${{ matrix.target }}/BUILD-INFO.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: crewlight-v${{ steps.version.outputs.value }}-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/crewlight-v${{ steps.version.outputs.value }}-${{ matrix.target }}.tar.gz
            release/crewlight-v${{ steps.version.outputs.value }}-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: crewlight-v${{ steps.version.outputs.value }}-${{ matrix.target }}-desktop
          if-no-files-found: error
          path: |
            release/desktop-builder/Crewlight-${{ steps.version.outputs.value }}-${{ matrix.architecture }}.dmg
            release/desktop-builder/Crewlight-${{ steps.version.outputs.value }}-${{ matrix.architecture }}.dmg.sha256

  release-gate:
    name: Aggregate release gate
    needs: [release-linux-x64, release-windows-x64, release-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: crewlight-v*-*
          path: release
          merge-multiple: true
      - run: pnpm release:manifest
      - run: pnpm release:manifest:verify
        env:
          CREWLIGHT_RELEASE_AGGREGATE: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: crewlight-release-manifest
          if-no-files-found: error
          path: |
            release/release-manifest.json
            release/*.sha256
